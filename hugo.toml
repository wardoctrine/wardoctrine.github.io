baseURL = "https://wardoctrine.github.io/"
locale = "en-us"
title = "War Doctrine"
theme = "PaperMod"
paginate = 10
enableRobotsTXT = true

# Required for PaperMod Fuse.js search (see theme wiki Features → Search Page)
[outputs]
  home = ["HTML", "RSS", "JSON"]

[params]
  author = "War Doctrine"
  description = "Untold military history stories. Battles, decisions, and the people history forgot."
  defaultTheme = "dark"
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true

[params.homeInfoParams]
  Title = "War Doctrine"
  Content = "Untold military history. Every story history forgot."

[[params.socialIcons]]
  name = "youtube"
  url = "https://youtube.com/@WarDoctrineHQ"

[taxonomies]
  category = "categories"
  tag = "tags"
  series = "series"

[[menu.main]]
  identifier = "posts"
  name = "Posts"
  url = "/"
  weight = 10

[[menu.main]]
  identifier = "about"
  name = "About"
  url = "/about/"
  weight = 20

[[menu.main]]
  identifier = "privacy"
  name = "Privacy"
  url = "/privacy-policy/"
  weight = 30

[[menu.main]]
  identifier = "content-policy"
  name = "Content policy"
  url = "/content-policy/"
  weight = 40

[params.footer]
  text = "[About](/about/) · [Privacy Policy](/privacy-policy/) · [Content policy](/content-policy/)"